<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Permissions - Camera Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25c0f4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 flex flex-col h-screen overflow-hidden">
<!-- Top App Bar Component -->
<header class="flex items-center p-4 justify-between bg-background-light dark:bg-background-dark">
<button aria-label="Back" class="flex size-10 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Permissions</h2>
</header>
<!-- Main Content Container (No Scrolling) -->
<main class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
<!-- Illustration/Hero Image Area -->
<div class="w-full max-w-md aspect-square rounded-xl bg-primary/10 dark:bg-primary/5 flex items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary via-transparent to-transparent"></div>
<!-- Representing the Camera Visual -->
<div class="relative flex flex-col items-center">
<div class="size-32 rounded-full bg-primary/20 flex items-center justify-center border-4 border-primary/30">
<span class="material-symbols-outlined text-primary !text-6xl">photo_camera</span>
</div>
<div class="mt-6 flex gap-2">
<div class="size-3 rounded-full bg-primary animate-pulse"></div>
<div class="size-3 rounded-full bg-primary/40"></div>
<div class="size-3 rounded-full bg-primary/40"></div>
</div>
</div>
<!-- Background Decoration Image/Pattern -->
<div class="absolute inset-0 -z-10 opacity-30 bg-cover bg-center" data-alt="Abstract camera lens blur with neon blue lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDK1wm8Op8ySWtHgdfLlO8cMCehx8VeCMSXcyiLvDIlkQWe7rC6odwIJYnvWSq_6BGJUZiMce1UJRLO7if2Tgj1tYU20dq84FAzAtZ4C11vExe78oLuuid_i5EEu5WA4CqM8FmS1QQup9tuo2HsAT_eF1kezf5a26u5HIKeAlbE8d91KsucBBx3Peax1bFn1TwcDtVx6VZ37zX-eAyE4Cv6OIo15hoPj4FeC7AgmEHLFtqixFmGtft6EBb5IIN7-3Qh6v2jTVao5_k");'>
</div>
</div>
<!-- Text Content -->
<div class="max-w-md text-center space-y-4">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold leading-tight tracking-tight">
                Allow Camera Access
            </h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                We need access to your camera so you can take and share photos directly within the app. This enables scanning features and profile personalization.
            </p>
</div>
</main>
<!-- Action Buttons -->
<footer class="p-6 bg-background-light dark:bg-background-dark">
<div class="flex flex-col gap-3 max-w-md mx-auto w-full">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-background-dark text-lg font-bold leading-normal tracking-wide w-full hover:brightness-110 active:scale-[0.98] transition-all">
<span class="truncate">Allow Access</span>
</button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-lg font-bold leading-normal tracking-wide w-full hover:bg-slate-300 dark:hover:bg-slate-700 active:scale-[0.98] transition-all">
<span class="truncate">Continue Without</span>
</button>
</div>
<!-- Spacer for safe area on mobile -->
<div class="h-4"></div>
</footer>
</body></html>
