<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Assistance Active</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25c0f4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden h-screen flex flex-col">
<!-- Top App Bar -->
<header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark border-b border-primary/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
<h2 class="text-lg font-bold tracking-tight">Assistance Active</h2>
</div>
<div class="flex items-center gap-2 px-3 py-1 bg-primary/10 rounded-full border border-primary/20">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-xs font-bold text-primary uppercase tracking-widest">Running</span>
</div>
</header>
<main class="flex-1 flex flex-col p-4 gap-4 justify-between max-w-2xl mx-auto w-full">
<!-- Large Alert Area -->
<div class="flex-1 flex flex-col items-center justify-center rounded-xl bg-primary/5 border-2 border-primary/20 p-8 text-center gap-6">
<div class="relative">
<div class="absolute -inset-4 bg-primary/20 blur-2xl rounded-full"></div>
<span class="material-symbols-outlined text-primary text-8xl relative" data-icon="warning">warning</span>
</div>
<div class="space-y-2">
<h1 class="text-5xl font-black tracking-tight text-slate-900 dark:text-white uppercase">Obstacle Ahead</h1>
<p class="text-xl text-slate-600 dark:text-primary/70 font-medium leading-relaxed">Large object detected 3 meters ahead on your current path.</p>
</div>
</div>
<!-- Feedback & Status -->
<div class="grid grid-cols-1 gap-4">
<!-- Toggle Component -->
<div class="flex items-center justify-between gap-4 rounded-xl border border-primary/20 bg-primary/5 p-6">
<div class="flex items-center gap-4">
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</div>
<div class="flex flex-col">
<p class="text-lg font-bold leading-tight">Audio Alerts</p>
<p class="text-slate-500 dark:text-slate-400 text-sm">Voice guidance is active</p>
</div>
</div>
<label class="relative flex h-8 w-14 cursor-pointer items-center rounded-full border-none bg-slate-200 dark:bg-slate-700 p-1 has-[:checked]:bg-primary transition-colors">
<input checked="" class="invisible absolute peer" type="checkbox"/>
<div class="h-6 w-6 rounded-full bg-white shadow-md transform transition-transform peer-checked:translate-x-6"></div>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 pb-4">
<button class="flex w-full items-center justify-center gap-3 rounded-xl h-16 px-6 bg-primary text-background-dark text-xl font-black tracking-tight hover:opacity-90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined font-bold" data-icon="stop_circle">stop_circle</span>
<span>STOP ASSISTANCE</span>
</button>
<p class="text-center text-slate-500 text-xs font-medium uppercase tracking-[0.2em]">Press and hold to confirm shutdown</p>
</div>
</main>
<!-- Visual Element Background Decoration -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
</body></html>
