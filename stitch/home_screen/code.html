<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25c0f4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>AI Blind Assistant</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden h-screen flex flex-col">
<header class="flex items-center justify-between p-6 bg-background-light dark:bg-background-dark border-b border-primary/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-4xl">visibility</span>
<h1 class="text-2xl font-bold tracking-tight">Vision AI</h1>
</div>
<button class="flex items-center justify-center size-12 rounded-full bg-primary/10 text-primary border border-primary/20">
<span class="material-symbols-outlined text-3xl">account_circle</span>
</button>
</header>
<main class="flex-1 flex flex-col p-6 gap-6 justify-center">
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2 rounded-xl bg-slate-100 dark:bg-primary/5 p-5 border border-primary/10">
<p class="text-slate-500 dark:text-primary/70 text-sm font-bold uppercase tracking-wider">Current Mode</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">directions_walk</span>
<p class="text-xl font-bold">Mobile Mode</p>
</div>
</div>
<div class="flex flex-col gap-2 rounded-xl bg-slate-100 dark:bg-primary/5 p-5 border border-primary/10">
<p class="text-slate-500 dark:text-primary/70 text-sm font-bold uppercase tracking-wider">System Status</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-emerald-500">check_circle</span>
<p class="text-xl font-bold">Ready</p>
</div>
</div>
</div>
<div class="flex flex-col gap-4 flex-1 justify-center">
<button class="w-full flex-1 max-h-48 bg-primary hover:bg-primary/90 text-background-dark rounded-xl flex flex-col items-center justify-center gap-3 shadow-lg shadow-primary/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-6xl font-bold">play_arrow</span>
<span class="text-3xl font-black uppercase tracking-tight">Start Assistance</span>
</button>
<button class="w-full py-8 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-900 dark:text-slate-100 rounded-xl flex items-center justify-center gap-4 border-2 border-slate-300 dark:border-slate-700 transition-all active:scale-95">
<span class="material-symbols-outlined text-4xl">stop</span>
<span class="text-2xl font-bold uppercase tracking-tight">Stop Assistance</span>
</button>
</div>
</main>
<nav class="flex gap-2 border-t border-primary/10 bg-background-light dark:bg-background-dark px-4 pb-8 pt-4">
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-xl py-3 bg-primary/10 text-primary border border-primary/20" href="#">
<span class="material-symbols-outlined text-3xl">grid_view</span>
<p class="text-sm font-bold leading-normal">Mode</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-xl py-3 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined text-3xl">memory</span>
<p class="text-sm font-bold leading-normal">Cap Status</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-xl py-3 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined text-3xl">settings</span>
<p class="text-sm font-bold leading-normal">Settings</p>
</a>
</nav>
</body></html>
