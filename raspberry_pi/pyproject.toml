[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-blind-assistant-pi"
version = "0.1.0"
description = "Offline Raspberry Pi wearable service for AI Blind Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0.2,<7",
  "websockets>=14,<16",
  "zeroconf>=0.147,<1",
  "ncnn==1.0.20260526; platform_machine == 'aarch64' and sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
ai-blind-pi = "ai_blind_pi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
